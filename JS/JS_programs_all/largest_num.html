<!DOCTYPE html>
<html lang="en">
<head>
    <title>Largest Among Three Numbers</title>
</head>
<body>
        <h2>Largest Among Three Numbers</h2>
        <!-- Input fields for three numbers -->
        <input type="number" id="num1" placeholder="Enter first number">
        <input type="number" id="num2" placeholder="Enter second number">
        <input type="number" id="num3" placeholder="Enter third number">

        <button onclick="Largest()">Find Largest</button>
        <p>The result is:</p><br>

            <p id="result"></p>


    <script>
        // Function to find largest among three numbers
        function Largest() 
        {
            // Get values from input fields
            let num1 = Number(document.getElementById('num1').value);
            let num2 = Number(document.getElementById('num2').value);
            let num3 = Number(document.getElementById('num3').value);
      
            // Find largest number
            let largest;
            if(num1 >= num2 && num1 >= num3) {
                largest = num1;
            } else if(num2 >= num1 && num2 >= num3) {
                largest = num2;
            } else {
                largest = num3;
            }
            
            // Display result
            document.getElementById('result').innerHTML = `Numbers: ${num1}, ${num2}, ${num3}<br><br>
            Largest Number:  ${largest}`;
        }
    </script>
</body>
</html>

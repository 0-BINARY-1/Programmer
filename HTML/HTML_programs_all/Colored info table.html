<!DOCTYPE html>
<html>
<head>
    <title>Student Table</title>
</head>
<body>
    <h1>Student Information</h1>

    <!-- 
    These attributes are obsolete in HTML5 but still work in most browsers for backward compatibility.
    border for the table edge width 2 = 2px width
    cellpadding for how big the cells should be 8 = 8px padding inside each cell
    cellspacing for the space between cells 3 = 3px space between cells
    
     -->

    <table border="2" cellpadding="8" cellspacing="3">
        <tr>
            <th><font color="red">Roll No</font></th>
            <th><font color="blue">Name</font></th>
            <th><font color="green">Class</font></th>
            <th><font color="purple">Marks</font></th>
        </tr>
        <tr>
            <td><font color="red">101</font></td>
            <td><font color="blue">Rahul Karki</font></td>
            <td><font color="green">XII</font></td>
            <td><font color="purple">85%</font></td>
        </tr>
        <tr>
            <td><font color="red">102</font></td>
            <td><font color="blue">Priya Shrestha</font></td>
            <td><font color="green">XII</font></td>
            <td><font color="purple">92%</font></td>
        </tr>
        <tr>
            <td><font color="red">103</font></td>
            <td><font color="blue">Amit Ojha</font></td>
            <td><font color="green">XI</font></td>
            <td><font color="purple">78%</font></td>
        </tr>
        <tr>
            <td><font color="red">104</font></td>
            <td><font color="blue">Neha Chand</font></td>
            <td><font color="green">XI</font></td>
            <td><font color="purple">88%</font></td>
        </tr>
    </table>
</body>
</html>

<!DOCTYPE html> 
<!--This is the document type declaration which tells the browser that this is an HTML5 document.-->
<html> 
  <!--This is the root element of the HTML document. All other elements will be nested inside this element.-->
<head> 
  <!--This is the head section of the HTML document. It contains meta-information about the document, such as the title, character 
  encoding, and links to stylesheets or scripts.-->

    <title>First Web Page</title> 
  <!--This is the title of the web page. It will be displayed in the browser's title bar or tab.-->
</head>                           
  <!--End of the head section.-->

<body bgcolor = "lightgreen" text = "darkblue"> 
  <!--This is the body section of the HTML document. 
  It contains the content that will be displayed on the web page.
  The bgcolor attribute sets the background color of the body to light green, 
  and the text attribute sets the default text color to dark blue.-->

    <h1>The content is in the body.</h1> 
  <!--This is a heading element (h1) that displays the text "The content is in the body." on the web page. 
  It is a child element of the body tag, which means it is nested inside the body tag.-->

    <font size = "5" color = "red" face = "Arial"> 
   <!--This is a font tag. It is used to specify the font size, color, and face for the text that is enclosed within the font tag. 
   In this case, the font size is set to 5, the color is set to red, and the face is set to Arial. 
   The text "this is a font tag..." will be displayed in red color, with a font size of 5 and using the Arial font. 
   The font tag is a child element of the body tag, which means it is nested inside the body tag.-->

        <h1>This text is inside the first font tag which is inside body tag.</h1> 
    <!-- This is the content of the font tag -->
        
    </font>
<!-- Similarly other font tags -->
    <font size = "6" color = "orange" face = "Times New Roman">
        <h1>This text is inside the second font tag which is inside body tag.</h1>
    </font>

    <font size = "8" color = "purple" face = "Comic Sans MS">
        <h1>This text is inside the third font tag which is inside body tag.</h1>
    </font>

</body> 
  <!--End of the body section. All content that is displayed on the web page should be placed inside the body tag.-->
</html> 
<!--End of the body section and the HTML document.-->

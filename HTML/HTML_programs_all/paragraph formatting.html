<!DOCTYPE html>
<html>
    <head>
        <title>Paragraph formatting</title>
    </head>
    <body>
        <h2 style = "color : red">Bold</h2>
        <p><b>This content is in bold format.</b></p>
        <h2 style = "color : red">Italic</h2>
        <p><i>This content is in italic format.</i></p>
        <h2 style = "color : red">Underline</h2>
        <p><u>This content is in underlined format.</u></p>
    </body>
</html>

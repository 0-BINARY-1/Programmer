<!DOCTYPE html>
<html lang="en">
<head>
    <title>External Links</title>
</head>
<body>
    <h1 align="center">Useful website links:</h1>

    <!-- 
    With _target="_blank"  the link will open in a new tab without the link will open on the same tab
    
    <a href="https://www.example.com" target="_blank" rel="noopener noreferrer">Example</a> - Open safely in new tab.
     -->

    <p><a href="https://www.youtube.com">YouTube</a>- YouTube link.</p>
    <ul>
        <li><a href="https://www.google.com" target="_blank">Google</a></li>
    </ul>
    <ol>
        <li><a href="https://www.facebook.com" target="_blank">Facebook</a></li>
    </ol>
    
</body>
</html>

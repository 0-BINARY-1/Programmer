<!DOCTYPE html>
<html>
    <head>
        <title>Image and moving text with red color</title>
    </head>
    <body>
        <center>
            <img src = "programmer.jpg" alt="A programmer working on the desk." width = "700" height="400" border = "5">
            <!-- alt consists of the description of the image that is useful when images cannot be displayed, SEO , accessibility-->
        </center>

        <marquee behavior = "scroll" direction = "right" style = "color : rgb(30, 192, 36);">Hello, I am moving text!</marquee>
        <!-- marquee is completely obsolete but still supported, best use CSS for modern styling -->
         
    </body>
</html>

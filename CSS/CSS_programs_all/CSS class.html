<!DOCTYPE html>
<html>
<head>
    <title>CSS class 'ABC' example</title>
    <style>
        .abc
        {
            background-color: yellow;
            color: black;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
            border: 1px solid black;
        }
        .xyz
        {
            background-color: lightblue;
            color: rgb(225, 0, 0);
            font-family: 'Arial', sans-serif;
            padding: 10px;
            border: 1px dashed rgb(0, 0, 102);
        }
    </style>
</head>
<body>
    <div class="abc">
        This element has yellow background and black text color.
    </div>
    <p class="abc">
        This paragraph also uses the 'abc' class styling, so it will have the same yellow background and black text color as the div above.
    </p>
    <p class="xyz">
        This paragraph uses the styling of another CSS class called 'xyz'.
    </p>
</body>
</html>
